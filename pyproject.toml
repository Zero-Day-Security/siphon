[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon"
version = "0.1.0"
description = "AI-native HTTP intercepting proxy with MCP integration, evidence capture, and built-in browser"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["proxy", "security", "pentest", "mcp", "http", "intercepting-proxy", "burp-suite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "mitmproxy>=10.0,<13",
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
    "httpx>=0.25,<1",
    "websockets>=12.0,<14",
    "mcp>=1.0,<2",
    "playwright>=1.40,<2",
    "pyngrok>=7.0,<8",
    "defusedxml>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/Zero-Day-Security/siphon"
Repository = "https://github.com/Zero-Day-Security/siphon"
Issues = "https://github.com/Zero-Day-Security/siphon/issues"

[project.scripts]
siphon = "siphon.main:main"
siphon-mcp = "siphon.mcp.server:main"

[tool.setuptools.packages.find]
include = ["siphon*"]
